<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Caos no Casamento</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
<meta name="apple-mobile-web-app-title" content="Caos">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  body{position:fixed;inset:0;width:100%}
  #wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
  html,body{touch-action:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
  #crt{position:absolute;inset:0;pointer-events:none;display:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="768" height="448"></canvas><div id="crt"></div></div>
<script src="versao.js"></script>
<script src="game.js"></script>
<script src="toque.js"></script>
<script>
if ("serviceWorker" in navigator) {
  var tinha = !!navigator.serviceWorker.controller, recarregou = false;
  navigator.serviceWorker.addEventListener("controllerchange", function () { if (tinha && !recarregou) { recarregou = true; location.reload(); } });
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(function (r) { r.update(); }).catch(function () {});
}
</script>
</body>
</html>
